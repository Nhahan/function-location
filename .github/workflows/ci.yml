name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
      - 'ci-verify/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
