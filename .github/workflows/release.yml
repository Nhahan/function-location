name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release process without publishing to npm.'
        required: false
        default: false
        type: boolean

jobs:
  guard:
    name: release-branch-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce release branch
        run: |
          RELEASE_BRANCH=dev \
            RELEASE_DRY_RUN=${{ inputs.dry_run }} \
            GITHUB_REF=${{ github.ref }} \
            node ./scripts/verify-release-branch.js

  test:
    name: test-${{ matrix.os }}-node-${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run test suite
        run: npm test -- --runInBand

  prebuild:
    name: prebuild-${{ matrix.os }}-node-${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build native artifact
        run: npm run build:all

      - name: Build platform prebuild
        run: npm run prebuild

      - name: Verify prebuild platform artifact
        run: npm run verify:prebuild

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: prebuilds
          if-no-files-found: error

  prebuild-coverage:
    name: prebuild-coverage
    runs-on: ubuntu-latest
    needs: [prebuild]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: downloaded-prebuilds
          merge-multiple: true

      - name: Merge prebuild artifacts
        run: PREBUILD_ARTIFACT_ROOT=downloaded-prebuilds PREBUILD_MERGED_DIR=merged-prebuilds node ./scripts/merge-prebuild-artifacts.js

      - name: Verify prebuild cross-platform coverage
        run: node ./scripts/verify-prebuild-coverage.js --base-dir=merged-prebuilds --required='darwin-arm64|darwin-x64,linux-x64|linux-arm64,win32-x64' --required-min=2

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [test, prebuild-coverage]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: downloaded-prebuilds
          merge-multiple: true

      - name: Merge prebuild artifacts
        run: PREBUILD_ARTIFACT_ROOT=downloaded-prebuilds PREBUILD_MERGED_DIR=prebuilds node ./scripts/merge-prebuild-artifacts.js

      - name: Prepare release package
        run: npm run release:prepare

      - name: Resolve release package metadata
        id: release_metadata
        run: |
          echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Verify release version is new
        run: |
          if npm view "${{ steps.release_metadata.outputs.name }}@${{ steps.release_metadata.outputs.version }}" version >/tmp/npm-view.out 2>/tmp/npm-view.err; then
            echo "${{ steps.release_metadata.outputs.name }}@${{ steps.release_metadata.outputs.version }} already exists on npm."
            echo "Publish would overwrite an existing release. Bump package.json version before retrying."
            exit 1
          fi

          if ! grep -q "E404" /tmp/npm-view.err; then
            echo "Failed to verify npm version availability."
            cat /tmp/npm-view.err
            exit 1
          fi

      - name: Verify release branch
        env:
          RELEASE_BRANCH: dev
          GITHUB_REF: ${{ github.ref }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: node ./scripts/verify-release-branch.js

      - name: Build .npm auth config
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set.";
            exit 1;
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Dry run publish
        if: ${{ inputs.dry_run == 'true' }}
        run: npm publish --access public --dry-run

      - name: Publish package
        if: ${{ inputs.dry_run != 'true' }}
        run: npm publish --access public
