name: Release

permissions:
  contents: read

# Never cancel a running release: an interrupted publish leaves packages half-released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release process without publishing to npm.'
        required: false
        default: false
        type: boolean

jobs:
  guard:
    name: release-branch-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce release branch
        run: |
          RELEASE_BRANCH=main \
            RELEASE_DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }} \
            GITHUB_REF=${{ github.ref }} \
            node ./scripts/verify-release-branch.js

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      prebuild_matrix: ${{ steps.prebuild_matrix.outputs.json }}
      package_matrix: ${{ steps.package_matrix.outputs.json }}
      compat_matrix: ${{ steps.compat_matrix.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Resolve prebuild matrix
        id: prebuild_matrix
        run: echo "json=$(node ./scripts/workflow-matrix.js prebuild)" >> "$GITHUB_OUTPUT"

      - name: Resolve package matrix
        id: package_matrix
        run: echo "json=$(node ./scripts/workflow-matrix.js package)" >> "$GITHUB_OUTPUT"

      - name: Resolve compatibility matrix
        id: compat_matrix
        run: echo "json=$(node ./scripts/workflow-matrix.js compat)" >> "$GITHUB_OUTPUT"

  test:
    name: test-${{ matrix.os }}-node-${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Run test suite
        run: npm test -- --runInBand

  root-package:
    name: package-root
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Build TypeScript artifacts
        run: npm run build

      - name: Verify root package tarball
        run: npm run verify:pack

      - name: Create root package tarball
        run: node ./scripts/create-package-tarball.js --out-dir=artifacts

      - name: Upload root package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-function-location
          path: artifacts/*.tgz
          compression-level: 0
          if-no-files-found: error

  prebuild:
    name: prebuild-${{ matrix.packageName }}-abi${{ matrix.abi }}
    runs-on: ${{ matrix.runner }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.prebuild_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.hostNodeVersion }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Build platform prebuilds
        run: npm run build:prebuilds -- --package=${{ matrix.packageName }} --target=${{ matrix.targetNodeVersion }}

      - name: Verify platform prebuilds
        env:
          PREBUILD_TARGETS: ${{ matrix.targetNodeVersion }}
          PREBUILD_VERIFY_SMOKE: '0'
        run: npm run verify:prebuild -- --package=${{ matrix.packageName }}

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.packageDir }}/prebuilds/${{ matrix.platformDir }}/*.node
          compression-level: 0
          if-no-files-found: error

  platform-package:
    name: package-${{ matrix.packageName }}
    runs-on: ubuntu-latest
    needs: [plan, prebuild]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.package_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodeVersion }}

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifactPattern }}
          path: ${{ matrix.packageDir }}/prebuilds/${{ matrix.platformDir }}
          merge-multiple: true

      - name: Verify platform prebuilds
        env:
          PREBUILD_VERIFY_SMOKE: '0'
        run: npm run verify:prebuild -- --package=${{ matrix.packageName }}

      - name: Verify platform package tarball
        run: node ./scripts/verify-pack-tarball.js --package-dir=${{ matrix.packageDir }}

      - name: Create platform package tarball
        run: node ./scripts/create-package-tarball.js --package-dir=${{ matrix.packageDir }} --out-dir=artifacts

      - name: Upload platform package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.packageName }}
          path: artifacts/*.tgz
          compression-level: 0
          if-no-files-found: error

  compatibility:
    name: compat-${{ matrix.compatibilityLabel }}-node-${{ matrix.nodeVersion }}
    runs-on: ${{ matrix.runner }}
    needs: [plan, root-package, platform-package]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.compat_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodeVersion }}
          architecture: ${{ matrix.nodeArchitecture }}

      - name: Download root package artifact
        uses: actions/download-artifact@v8
        with:
          name: package-function-location
          path: artifacts/root

      - name: Download platform package artifact
        uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.packageName }}
          path: artifacts/platform

      - name: Install packed packages and run smoke test
        shell: bash
        run: |
          root_tarball="$(find artifacts/root -maxdepth 1 -name '*.tgz' -type f | head -n 1)"
          platform_tarball="$(find artifacts/platform -maxdepth 1 -name '*.tgz' -type f | head -n 1)"

          if [ -z "$root_tarball" ] || [ -z "$platform_tarball" ]; then
            echo "Required tarball artifacts were not downloaded."
            exit 1
          fi

          node ./scripts/run-compat-smoke.js \
            --root-tarball="$root_tarball" \
            --platform-tarball="$platform_tarball" \
            --expected-node-arch="${{ matrix.nodeArchitecture }}" \
            --expected-host-arm64="${{ matrix.expectedHostArm64 }}" \
            --expected-translated="${{ matrix.expectedTranslated }}"

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: compatibility
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: artifacts

      - name: Resolve publish settings
        id: settings
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            tag="dry-run"
            version_suffix="dryrun.${GITHUB_RUN_ID}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="beta"
            version_suffix="beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
            version_suffix=""
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_suffix=$version_suffix" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Configure npm authentication
        if: ${{ steps.settings.outputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; publishing through npm trusted publishing (OIDC)."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Publish packages
        env:
          PUBLISH_TAG: ${{ steps.settings.outputs.tag }}
          PUBLISH_VERSION_SUFFIX: ${{ steps.settings.outputs.version_suffix }}
          PUBLISH_DRY_RUN: ${{ steps.settings.outputs.dry_run }}
        run: |
          args=(--artifacts-dir=artifacts "--tag=$PUBLISH_TAG")
          if [ -n "$PUBLISH_VERSION_SUFFIX" ]; then
            args+=("--version-suffix=$PUBLISH_VERSION_SUFFIX")
          fi
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node ./scripts/publish-packages.js "${args[@]}"
