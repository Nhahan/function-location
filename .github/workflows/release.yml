name: Release

permissions:
  contents: read

# Never cancel a running release: an interrupted publish leaves packages half-released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release process without publishing to npm.'
        required: false
        default: false
        type: boolean

jobs:
  guard:
    name: release-branch-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce release branch
        run: |
          RELEASE_BRANCH=main \
            RELEASE_DRY_RUN=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }} \
            GITHUB_REF=${{ github.ref }} \
            node ./scripts/verify-release-branch.js

  build:
    name: build
    needs: guard
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Download package artifacts
        id: download_packages
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: artifacts

      # Artifact downloads occasionally fail with transient network errors.
      - name: Wait before retrying artifact download
        if: steps.download_packages.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry download package artifacts
        if: steps.download_packages.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: artifacts

      - name: Resolve publish settings
        id: settings
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            tag="dry-run"
            version_suffix="dryrun.${GITHUB_RUN_ID}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="beta"
            version_suffix="beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
            version_suffix=""
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_suffix=$version_suffix" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Configure npm authentication
        if: ${{ steps.settings.outputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; publishing through npm trusted publishing (OIDC)."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Publish packages
        env:
          PUBLISH_TAG: ${{ steps.settings.outputs.tag }}
          PUBLISH_VERSION_SUFFIX: ${{ steps.settings.outputs.version_suffix }}
          PUBLISH_DRY_RUN: ${{ steps.settings.outputs.dry_run }}
        run: |
          args=(--artifacts-dir=artifacts "--tag=$PUBLISH_TAG")
          if [ -n "$PUBLISH_VERSION_SUFFIX" ]; then
            args+=("--version-suffix=$PUBLISH_VERSION_SUFFIX")
          fi
          if [ "$PUBLISH_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node ./scripts/publish-packages.js "${args[@]}"
