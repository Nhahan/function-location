<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
  <title id="title">function-location benchmark sample</title>
  <desc id="desc">A horizontal log-scale bar chart comparing locate and an inspector-protocol baseline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <rect width="860" height="300" fill="url(#bg)"/>

  <text x="36" y="42" fill="#0f172a" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    function-location benchmark sample
  </text>
  <text x="36" y="68" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">
    Environment: macOS • Node v22.20.0 • Avg. latency per call • log scale • lower is better
  </text>

  <line x1="220" y1="98" x2="780" y2="98" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="220" y1="98" x2="220" y2="228" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="220" y1="98" x2="220" y2="228" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="407" y1="98" x2="407" y2="228" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="593" y1="98" x2="593" y2="228" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="780" y1="98" x2="780" y2="228" stroke="#cbd5e1" stroke-width="1"/>

  <text x="220" y="88" fill="#64748b" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">0.1 µs</text>
  <text x="407" y="88" fill="#64748b" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">1 µs</text>
  <text x="593" y="88" fill="#64748b" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">10 µs</text>
  <text x="780" y="88" fill="#64748b" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">100 µs</text>

  <text x="36" y="142" fill="#0f172a" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="700">locate</text>
  <text x="36" y="197" fill="#0f172a" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="700">inspector protocol</text>

  <rect x="220" y="120" width="34" height="22" rx="11" fill="#16a34a"/>
  <rect x="220" y="175" width="506" height="22" rx="11" fill="#2563eb"/>

  <text x="270" y="136" fill="#0f172a" font-size="12" font-family="Arial, Helvetica, sans-serif">0.18 µs/call</text>
  <text x="742" y="191" fill="#0f172a" font-size="12" font-family="Arial, Helvetica, sans-serif" text-anchor="end">50.92 µs/call</text>

  <text x="36" y="246" fill="#475569" font-size="12" font-family="Arial, Helvetica, sans-serif">
    Relative result: locate is about 289x faster in this sample.
  </text>
</svg>
